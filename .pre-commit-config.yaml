# ============================================================================
#  OA 门禁配置 — 继承 quality-gate 样板，全 language: system
#  复制自 D:\work\pre-commit-quality-gate
# ============================================================================

default_language_version:
  python: python3.12

# 排除 .workbuddy/backups/ 下的 52K 备份文件（仅扫描真实代码 ~3800 文件）
repos:
  - repo: local
    hooks:
      # —— 通用：文件卫生 ———————————————————————————————
      - id: trailing-whitespace
        name: trailing whitespace
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/trailing_whitespace.py"
        language: system
        types: [text]
        exclude: ^\.workbuddy/backups/

      - id: end-of-file-fixer
        name: end of file fixer
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/end_of_file_fixer.py"
        language: system
        types: [text]
        exclude: ^\.workbuddy/backups/

      - id: check-yaml
        name: check yaml
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/check_yaml.py --allow-multiple-documents"
        language: system
        types: [yaml]
        exclude: ^\.workbuddy/backups/

      - id: check-json
        name: check json
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/check_json.py"
        language: system
        types: [json]
        exclude: ^\.workbuddy/backups/

      - id: check-toml
        name: check toml
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/check_toml.py"
        language: system
        types: [toml]
        exclude: ^\.workbuddy/backups/

      - id: check-merge-conflict
        name: check merge conflict
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/check_merge_conflict.py"
        language: system
        types: [text]
        exclude: ^\.workbuddy/backups/

      - id: check-added-large-files
        name: check added large files
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/check_added_large_files.py --maxkb=500"
        language: system
        exclude: ^\.workbuddy/backups/

      - id: check-case-conflict
        name: check case conflict
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/check_case_conflict.py"
        language: system
        exclude: ^\.workbuddy/backups/

      - id: mixed-line-ending
        name: mixed line ending
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/mixed_line_ending.py --fix=lf"
        language: system
        types: [text]
        exclude: ^\.workbuddy/backups/

      - id: detect-private-key
        name: detect private key
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/official/detect_private_key.py"
        language: system
        types: [text]
        exclude: ^\.workbuddy/backups/

      # —— Python 工具（.workbuddy/ 下的 py 脚本） —————————
      - id: black
        name: black
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/black.exe"
        language: system
        types: [python]
        args: ["--line-length=100", "--target-version=py312"]
        exclude: ^\.workbuddy/backups/

      - id: ruff
        name: ruff (lint + I 规则)
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/ruff.exe"
        language: system
        types: [python]
        require_serial: true
        args: ["check", "--fix", "--line-length=100", "--extend-select=I,UP,B,S"]
        exclude: ^\.workbuddy/backups/

      # —— 自研钩子 ——————————————————————————————————————
      - id: pandas-antipatterns
        name: pandas antipatterns
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/check_pandas_antipatterns.py"
        language: system
        types: [python]
        require_serial: true
        exclude: ^\.workbuddy/backups/

      - id: secrets
        name: secrets in source
        entry: "C:/Users/MRG/.workbuddy/binaries/python/envs/quality-gate/Scripts/python.exe hooks/check_secrets.py"
        language: system
        types: [text]
        exclude: |
          (?x)^(
              \.workbuddy/backups/
            | pc-web/dist/
            | \.github/workflows/
          )$
